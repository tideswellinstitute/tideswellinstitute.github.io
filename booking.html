<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Tideswell Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        body { font-family: 'Lora', serif; background-color: #fdfaf5; color: #2d3436; }
        .stone-border { border: 1px solid #d1ccc0; }
        .sepia-glow { filter: sepia(0.2) contrast(1.05); }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: opacity(0.5);
        }
    </style>
    <script src="layout.js"></script>
</head>
<body class="scroll-smooth">

    <div id="header-slot"></div>

    <main class="py-16 px-4 max-w-6xl mx-auto">
        
        <section id="contact" class="max-w-4xl mx-auto my-12">
            <div class="stone-border bg-white p-8 md:p-16 shadow-sm relative">
                <div class="absolute -top-2 -left-2 w-8 h-8 border-t border-l border-[#d1ccc0]"></div>
                <div class="absolute -bottom-2 -right-2 w-8 h-8 border-b border-r border-[#d1ccc0]"></div>

                <div class="text-center mb-12">
                    <span class="text-[#5d6d5e] uppercase tracking-[0.4em] text-[10px] font-bold mb-2 block">Reach Out</span>
                    <h2 class="text-4xl font-bold text-[#2d4a3e]">How can we help?</h2>
                    <div class="h-px w-16 bg-[#d1ccc0] mx-auto mt-6"></div>
                </div>

                <form action="#" method="POST" class="space-y-8">
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="flex flex-col">
                            <label for="name" class="text-[10px] uppercase tracking-widest text-stone-500 font-bold mb-2">Full Name</label>
                            <input type="text" id="name" name="name" required 
                                class="bg-[#fdfaf5] border-b border-stone-200 py-3 px-2 focus:outline-none focus:border-[#2d4a3e] transition-colors duration-300">
                        </div>
                        <div class="flex flex-col">
                            <label for="email" class="text-[10px] uppercase tracking-widest text-stone-500 font-bold mb-2">Email Address</label>
                            <input type="email" id="email" name="email" required 
                                class="bg-[#fdfaf5] border-b border-stone-200 py-3 px-2 focus:outline-none focus:border-[#2d4a3e] transition-colors duration-300">
                        </div>
                    </div>

                    <div class="flex flex-col">
                        <label for="reason" class="text-[10px] uppercase tracking-widest text-stone-500 font-bold mb-2">Reason for Inquiry</label>
                        <select id="reason" name="reason" 
                            class="bg-[#fdfaf5] border-b border-stone-200 py-3 px-2 focus:outline-none focus:border-[#2d4a3e] transition-colors duration-300 appearance-none">
                            <option value="general">General Inquiry</option>
                            <option value="coworking">Co-working & Memberships</option>
                            <option value="weddings">Weddings & Private Events</option>
                            <option value="history">Historical Research / Archives</option>
                            <option value="community">Community Room Hire</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="message" class="text-[10px] uppercase tracking-widest text-stone-500 font-bold mb-2">Your Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="How can the Institute assist you today?"
                            class="bg-[#fdfaf5] border-b border-stone-200 py-3 px-2 focus:outline-none focus:border-[#2d4a3e] transition-colors duration-300 resize-none"></textarea>
                    </div>

                    <div class="text-center pt-6">
                        <button type="submit" 
                            class="inline-block border border-[#2d4a3e] bg-[#2d4a3e] text-white px-12 py-4 text-xs font-bold uppercase tracking-widest hover:bg-white hover:text-[#2d4a3e] transition duration-500 cursor-pointer">
                            Submit Message
                        </button>
                        <p class="text-[10px] text-stone-400 mt-6 italic">We strive to respond to all inquiries within 48 hours.</p>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <div id="footer-slot"></div>

</body>
</html>
